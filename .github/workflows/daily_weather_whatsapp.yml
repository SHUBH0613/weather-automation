name: Daily 06:30 AM Weather to WhatsApp

on:
  schedule:
    # 01:00 UTC = 06:30 AM IST (Indian Standard Time)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  daily_weather_push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Option 1: Ping Render to run automation and host the PPT ─────────────
      - name: Trigger Render Service Webhook (if URL configured)
        id: trigger_render
        continue-on-error: true
        env:
          RENDER_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
        run: |
          if [ -n "$RENDER_URL" ]; then
            echo "Pinging Render to trigger daily weather automation..."
            HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_URL/api/trigger-daily?phone=%2B917761866811")
            echo "Render responded with HTTP $HTTP_STATUS:"
            cat response.txt
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 429 ]; then
              echo "render_triggered=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "render_triggered=false" >> $GITHUB_OUTPUT

      # ── Option 2: Fallback to running directly on GitHub runner ──────────────
      - name: Set up Python
        if: steps.trigger_render.outputs.render_triggered != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.trigger_render.outputs.render_triggered != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Weather Scraper & Send to WhatsApp
        if: steps.trigger_render.outputs.render_triggered != 'true'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER || 'whatsapp:+14155238886' }}
          TARGET_PHONE_NUMBER: "+917761866811"
        run: |
          python send_daily_whatsapp.py
